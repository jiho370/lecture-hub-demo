<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수업 녹음 · 미니</title>
<link rel="stylesheet" href="app.css">
<style>
/* 미니 녹음 창: 녹음 버튼 · 시간 · 레벨. 시안의 토큰과 녹음 버튼을 그대로 쓴다. */
body{overflow:hidden}
.mini{height:100vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px 14px;background:var(--panel)}
.mrow{display:flex;align-items:center;gap:12px}
.mini .recbtn{height:44px;padding:0 18px;font-size:14px}
.mini .recbtn.on{padding:0 14px 0 16px}
.mini .recbtn.confirm{background:var(--ink);box-shadow:none}
.mtime{font-size:22px;font-weight:600}
.mlevel{flex:1;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.mlevel i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .15s}
.mlevel.warn i{background:var(--warn)}
.mfoot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.mfoot .sp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfoot button{display:flex;align-items:center;gap:6px;border-radius:8px;padding:3px 6px;font-size:12px;color:var(--sub)}
.mfoot button:hover{background:var(--panel-2);color:var(--ink)}
.mfoot button:disabled{opacity:.4;pointer-events:none}
.mfoot svg{width:15px;height:15px}
.mnote{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--chip);border-radius:8px;padding:5px 8px}
.mnote[hidden],.mrow[hidden]{display:none}
.mnote .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--warn)}
.mnote button{border-radius:6px;padding:2px 7px;font-size:12px;background:var(--panel);color:var(--ink)}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-mini" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></symbol>
</svg>
<div class="mini">
  <div class="mrow">
    <button class="recbtn" id="recBtn"><svg><use href="#i-mic"/></svg><span class="label" id="label">녹음 시작</span></button>
    <span class="mtime num" id="time">00:00:00</span>
  </div>
  <div class="mnote" id="note" hidden><span class="t" id="noteText"></span><button id="noteA"></button><button id="noteB"></button></div>
  <div class="mrow" id="levelRow"><div class="mlevel" id="level"><i></i></div><span class="num" id="db" style="font-size:12px;color:var(--faint);min-width:52px;text-align:right">-∞ dB</span></div>
  <div class="mfoot">
    <span class="sp" id="what"></span>
    <button id="pauseBtn" title="녹음 일시정지 / 다시 녹음" disabled>일시정지</button>
    <button id="starBtn" title="★ 중요 표시 — 지금 시각을 표시해 두면 회차 화면에서 그 자리부터 들을 수 있습니다" disabled>★ 중요</button>
    <button id="pinBtn" title="다른 창 위에 항상 표시">항상 위 <span class="toggle on" id="pin"></span></button>
    <button id="bigBtn" title="큰 창으로"><svg><use href="#i-mini"/></svg>크게</button>
  </div>
</div>
<script>window.pywebview = parent.pywebview;</script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const fmt = (ms) => { const s = Math.floor((ms || 0) / 1000); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map((n) => String(n).padStart(2, "0")).join(":"); };
  let api = null, state = {}, confirmUntil = 0, onTop = true;

  function render() {
    const phase = state.phase, s = state.status || {}, live = phase === "recording";
    const btn = $("recBtn"), arming = live && Date.now() < confirmUntil;
    btn.classList.toggle("on", live || phase === "stopping");
    btn.classList.toggle("confirm", arming);
    btn.classList.toggle("busy", ["starting", "stopping", "finalizing"].includes(phase));
    $("label").textContent = arming ? "한 번 더 눌러 끝내기" : live ? "끝내기" : phase === "starting" ? "시작 중…" : phase === "stopping" || phase === "finalizing" ? "저장 중…" : "녹음 시작";
    const ms = live || phase === "stopping" ? s.elapsed_ms : (state.summary && state.summary.total_ms) || 0;
    const paused = live && !!s.paused;
    $("time").textContent = (paused ? "⏸ " : "") + fmt(ms);
    $("pauseBtn").disabled = !live;
    $("starBtn").disabled = !live;
    $("pauseBtn").textContent = paused ? "다시 녹음" : "일시정지";
    const rms = live && !s.paused ? s.rms : null, v = rms === null || rms === undefined ? 0 : Math.max(0, Math.min(1, (rms + 70) / 55));
    $("level").firstElementChild.style.width = (v * 100).toFixed(0) + "%";
    $("level").classList.toggle("warn", !!(live && s.quiet));
    $("db").textContent = live ? (rms === null || rms === undefined ? "-∞" : Math.round(rms)) + " dB" : "";
    const over = live && state.class_over, nxt = live && state.next_class;
    $("note").hidden = !(over || nxt); $("levelRow").hidden = !!(over || nxt);
    if (nxt) {
      $("noteText").textContent = `다음 수업 ${nxt.course}(${nxt.start})로 바꿀까요?`; $("noteText").title = $("noteText").textContent;
      $("noteA").textContent = "바꾸기"; $("noteA").dataset.a = "switch"; $("noteB").textContent = "계속"; $("noteB").dataset.a = "keep";
    } else if (over) {
      const auto = over.auto_stop_at_ms ? ` · ${new Date(over.auto_stop_at_ms).toTimeString().slice(0, 5)} 자동 정지` : "";
      $("noteText").textContent = (over.kind === "paused" ? "아직 일시정지 중" : "수업 끝난 듯") + auto;
      $("noteText").title = over.reason + auto;
      $("noteA").textContent = over.kind === "paused" ? "다시 녹음" : "멈추기"; $("noteA").dataset.a = over.kind === "paused" ? "resume" : "stop";
      $("noteB").textContent = "계속"; $("noteB").dataset.a = "snooze";
    }
    const course = (s.course !== undefined ? s.course : null);
    $("what").textContent = live ? (s.quiet ? "소리 매우 작음" : (course || "과목 미지정") + " · 녹음 중")
      : phase === "done" ? "저장됨 · 누락 " + ((state.summary && state.summary.dropped_samples) || 0) : phase === "error" ? (state.error || "오류") : "";
  }

  async function onRec() {
    const phase = state.phase;
    if (phase === "recording") {
      if (Date.now() < confirmUntil) { confirmUntil = 0; await api.stop(); } else { confirmUntil = Date.now() + 3000; }
      render(); return;
    }
    if (["starting", "stopping", "finalizing"].includes(phase)) return;
    const r = await api.start_selected();
    if (!r.ok) $("what").textContent = r.reason || "시작하지 못했습니다";
  }

  async function poll() {
    try { state = await api.state(); render(); } catch (e) { /* keep polling */ }
    setTimeout(poll, 250);
  }

  function start() {
    api = window.pywebview.api;
    $("recBtn").onclick = onRec;
    $("bigBtn").onclick = () => api.show_main();
    const noteAct = async (a) => {
      if (a === "switch" || a === "keep") return api.next_class_answer(a);
      if (a === "resume") { await api.pause(false); return api.class_over_answer("snooze"); }
      return api.class_over_answer(a);
    };
    $("noteA").onclick = () => noteAct($("noteA").dataset.a);
    $("noteB").onclick = () => noteAct($("noteB").dataset.a);
    $("pauseBtn").onclick = () => { if (state.phase === "recording") api.pause(!(state.status && state.status.paused)); };
    $("starBtn").onclick = async () => { const r = await api.bookmark(); if (r && r.ok) { const b = $("starBtn"); b.textContent = "★ 표시함"; setTimeout(() => { b.textContent = "★ 중요"; }, 1500); } };
    $("pinBtn").onclick = async () => { onTop = !onTop; $("pin").classList.toggle("on", onTop); await api.set_on_top(onTop); };
    poll();
  }
  if (window.pywebview && window.pywebview.api) start(); else window.addEventListener("pywebviewready", start);
})();
</script>
</body>
</html>
