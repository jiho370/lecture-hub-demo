<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Hub</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-mini" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-exam" viewBox="0 0 24 24"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="m9 13.5 2 2 4-4.5"/></symbol>
  <symbol id="i-door" viewBox="0 0 24 24"><path d="M4 21h16M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21"/><path d="M14.5 12v.5"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="7" y="4" width="13" height="16" rx="2"/><path d="M4 7v11a2 2 0 0 0 2 2"/><path d="M10.5 10h6M10.5 14h4"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
</svg>

<div class="app">
  <!-- left rail (user pick 2026-09-29: "B안"): destinations always visible, labelled -->
  <nav class="rail" id="rail">
    <button class="rb" id="homeBtn" title="오늘 — 이번 달 달력과 할 일(날짜를 누르면 일정 추가)"><svg><use href="#i-cal"/></svg><span>달력</span></button>
    <button class="rb" id="sideBtn" title="강의 목록 열기/닫기"><svg><use href="#i-folder"/></svg><span>강의</span></button>
    <button class="rb" id="searchBtn" title="전사·자료·노트 검색 (Ctrl K)"><svg><use href="#i-search"/></svg><span>검색</span></button>
    <button class="rb" id="examBtn" title="정리본 모음 — 과목별로 회차마다 만든 정리본을 모아 봅니다(시험 대비도 이 안에서)"><svg><use href="#i-exam"/></svg><span>정리본</span></button>
    <button class="rb" id="roomBtn" title="그스룸 예약 — 관정관 4층 6인실 (정기 예약은 창 안에서)"><svg><use href="#i-door"/></svg><span>그스룸</span></button>
    <button class="rb" id="memBtn" title="독일어 암기장 — 휴대폰과 진도가 이어지는 claude.ai 암기장을 창으로 엽니다"><svg><use href="#i-cards"/></svg><span>암기장</span></button>
    <button class="rb" id="inboxBtn" title="확인함 — 앱이 확신하지 못한 것"><svg><use href="#i-check"/></svg><span>확인</span><i class="badge num" id="inboxBadge" hidden></i></button>
    <span class="grow"></span>
    <button class="rb" id="importBtn" title="녹음 가져오기 — 휴대폰 등 앱 밖에서 녹음한 파일(창에 끌어다 놓아도 됩니다)"><svg><use href="#i-import"/></svg><span>가져오기</span></button>
    <button class="rb" id="sessionsBtn" title="녹음 정리 — 세션 폴더·버리기·되살리기"><svg><use href="#i-wave"/></svg><span>녹음</span></button>
    <button class="rb" id="miniBtn" title="미니 녹음 창으로"><svg><use href="#i-mini"/></svg><span>미니</span></button>
    <button class="rb" id="settingsBtn" title="설정 — 계정 연결(키·토큰)과 프로그램 확인"><svg><use href="#i-gear"/></svg><span>설정</span></button>
    <button class="rb" id="themeBtn" title="밝게/어둡게"><svg><use href="#i-moon"/></svg><span>테마</span></button>
  </nav>
  <!-- top bar -->
  <header class="top">
    <div class="title" id="title">새 녹음 <small class="num" id="subtitle"></small></div>
    <span class="lstate" id="lstate" hidden></span><button class="lnext" id="lnext" hidden></button><button class="ibtn lec-trash" id="lecDiscard" hidden title="이 회차 버리기 — 녹음을 휴지통으로(되살릴 수 있음)"><svg><use href="#i-trash"/></svg></button>
    <div class="right">
      <button class="exam-chip" id="examChip" hidden></button>
      <button class="cap-chip" id="qaBtn" title="발표 질의응답 도우미 — 자료와 실시간 자막으로 Claude가 답할 거리를 줌">질의응답</button>
      <button class="cap-chip" id="capBtn" title="실시간 자막 — 말하는 것을 바로 글로(Google)">자막</button>
      <div class="status-chip" title="녹음을 글로 바꾸는 서비스의 남은 양 — 누르면 자세히" id="engines" role="button" tabindex="0"><span><i class="dot"></i>전사</span></div>
    </div>
  </header>

  <main class="body" id="body">
    <!-- sidebar -->
    <aside class="pane side">
      <div class="side-head">강의</div>
      <div class="side-scroll">
        <div id="courseList"></div>
      </div>
    </aside>

    <!-- center -->
    <section class="center">
      <div class="pane home" id="home">
        <div class="phead"><b id="homeTitle"></b><span class="grow"></span><button class="ibtn" id="homePrev" title="이전 달" aria-label="이전 달"><svg><use href="#i-left"/></svg></button><button class="ibtn" id="homeNext" title="다음 달" aria-label="다음 달"><svg><use href="#i-right"/></svg></button><button class="ghost" id="homeAdd">+ 일정</button></div>
        <div class="cal-grid home-grid" id="homeGrid"></div>
      </div>
      <div class="pane">
        <div class="phead">
          <div class="seg" data-group="c">
            <button class="on" data-t="c-live" id="liveTab">실시간 전사</button><button data-t="c-html" id="htmlTab" hidden>정리본</button><button data-t="c-files" id="filesTab" hidden>자료·녹음</button>
          </div>
          <div class="tools html-tools" id="htmlTools" hidden><select id="htmlSel"></select><span class="size-seg" id="htmlSize"><button data-size="full" title="창 전체(Esc로 축소)">전체화면</button><button data-size="wide" title="사이드바와 전사를 접고 넓게">넓게</button><button data-size="pane" title="가운데 칸에서 보기">보통</button></span><button class="pick-more" id="htmlOpen" title="평소 쓰는 브라우저로 엽니다">새 창</button><button class="pick-more" id="noteRemake" title="전사로 정리본을 새로 만듭니다(직접 고친 정리본 파일은 덮어쓰지 않습니다)">다시 만들기</button></div>
        </div>
        <div class="tab on" id="c-live">
          <div class="live-head" id="liveHead"></div>
          <div class="live-body body-scroll" id="liveBody"></div>
        </div>
        <div class="tab" id="c-html"><div class="html-float" id="htmlFloat"><span id="htmlFloatName"></span><span class="size-seg"><button data-size="wide">넓게</button><button data-size="pane">보통</button></span><button class="float-trash" id="htmlDiscard" title="이 회차 버리기 — 녹음을 휴지통으로(되살릴 수 있음)">버리기</button><button data-size="pane" title="축소 (Esc)">✕</button></div><iframe id="htmlFrame" title="정리본" sandbox="allow-same-origin"></iframe>
          <div class="empty note-empty" id="noteEmpty" hidden></div>
        </div>
        <div class="tab" id="c-files">
          <div class="notes" id="filesList" style="display:none"></div>
          <div class="empty" id="filesEmpty">
            <svg style="width:34px;height:34px;color:var(--faint)"><use href="#i-folder"/></svg>
            <div class="big">연결된 자료가 없습니다</div>
            <div>이 회차에 연결된 자료와 녹음이 여기에 나옵니다.<br>자료는 평소 쓰는 프로그램으로 엽니다.</div>
          </div>
        </div>
      </div>
      <div class="pane memo">
        <div class="phead"><b style="font-size:13px">메모</b><span class="saved" id="memoSaved"></span></div>
        <textarea id="memo" placeholder="수업 중 메모를 적으세요. 녹음 시각이 함께 저장됩니다…"></textarea>
      </div>
    </section>

    <!-- right -->
    <section class="pane right">
      <div class="phead">
        <div class="seg" data-group="r">
          <button class="on" data-t="r-tr" id="rTitle">전사</button>
        </div>
      </div>
      <div class="todo body-scroll" id="todo"></div>

      <div class="tab on" id="r-tr">
        <div class="empty" id="trEmpty">
          <svg style="width:34px;height:34px;color:var(--faint)"><use href="#i-wave"/></svg>
          <div class="big">녹음 버튼을 눌러 시작하세요</div>
          <div>수업이 끝나면 이 회차에 연결하고, 동의한 과목은 Google로 바로 전사합니다.<br>필요하면 MAI로 보강할 수 있습니다.</div>
        </div>
        <div class="body-scroll" id="trList" style="display:none"></div>
        <div class="lv-head" id="lvHead" style="display:none"></div>
        <div class="lv-engines" id="lvEngines" style="display:none"></div>
        <div class="player" id="player" style="display:none">
          <button class="ibtn" id="playBtn" title="재생/정지"><svg><use href="#i-play"/></svg></button>
          <span class="num" id="playTime">00:00</span>
          <input type="range" id="playSeek" min="0" max="1000" value="0" aria-label="재생 위치">
          <span class="num faint" id="playDur"></span>
          <audio id="audio" preload="metadata"></audio>
        </div>
        <div class="body-scroll" id="lvList" style="display:none"></div>
      </div>

      <!-- record dock -->
      <div class="dock">
        <div class="over-card" id="overCard" hidden><div><b id="overTitle">수업이 끝난 것 같아요</b><small id="overWhy"></small><small class="auto" id="overAuto"></small></div><div class="acts"><button class="primary" data-over="stop" id="overMain">지금 멈추고 저장</button><button class="ghost" id="overMore">계속 ▾</button></div></div>
        <div class="over-card next-card" id="nextCard" hidden><div><b id="nextTitle"></b><small>지금 녹음을 저장하고, 같은 소리로 다음 수업 녹음을 바로 시작합니다</small></div><div class="acts"><button class="primary" data-next="switch">다음 수업으로 바꾸기</button><button class="ghost" data-next="keep">이 녹음 계속</button></div></div>
        <div class="health" id="health"><span><i class="dot wait"></i>준비 중…</span></div>
        <div class="recrow">
        <button class="recbtn" id="recBtn">
          <svg><use href="#i-mic"/></svg><span class="label">녹음 시작</span>
          <span class="wave" id="wave"></span><span class="timer num" id="timer">00:00:00</span>
        </button>
        <button class="rec2" id="rec2Btn" hidden></button>
        </div>
        <div class="toolbar">
          <button class="tb" id="courseBtn"><span class="v" id="courseName">과목</span> <svg><use href="#i-down"/></svg></button><span class="sep"></span>
          <button class="tb" id="srcBtn"><svg><use id="srcIcon" href="#i-mic"/></svg><span class="v" id="srcName">마이크</span> <svg><use href="#i-down"/></svg></button>
          <span class="grow"></span>
          <button class="tb rec-only" id="pauseBtn" title="녹음 일시정지 — 쉬는 시간 등. 멈춘 동안의 소리는 저장하지 않습니다"><svg><use href="#i-pause"/></svg><span id="pauseLabel"></span></button>
          <button class="tb rec-only" id="starBtn" title="지금 시각에 ★ 중요 표시"><svg><use href="#i-star"/></svg>중요</button>
          <button class="tb rec-only" id="discardBtn" title="지금 녹음을 버리기 — 휴지통으로(되살릴 수 있음)"><svg><use href="#i-trash"/></svg></button>
        </div>
      </div>
    </section>
  </main>
</div>
<button class="fixbtn" id="fixBtn" hidden>고치기</button>
<div class="notice-bar" id="noticeBar" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="demo-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
